name: Проверка сайтов
on:
  # Расписание нужно как страховка: основной цикл держится за счёт самозапуска в конце
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python check.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_PASSWORD: ${{ secrets.TELEGRAM_BOT_PASSWORD }}
      # Состояние (история за 7 суток) сохраняем всегда, даже если проверка упала
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: uptime-state-${{ github.run_id }}
      # Следующий запуск стартует сразу же, чтобы бот не «спал» между запусками расписания.
      # Защита от быстрого зацикливания: только если этот запуск шёл дольше двух минут.
      - name: Следующий запуск
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( $(date +%s) - START )) -gt 120 ]; then
            gh workflow run uptime.yml --repo "${{ github.repository }}"
          else
            echo "Запуск был коротким, цепочку не продолжаем (подхватит расписание)"
          fi
